<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-tw">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>w-geo-vue</title>

    <!-- @babel/polyfill -->
    <script
        nomodule
        src="https://cdn.jsdelivr.net/npm/@babel/polyfill/dist/polyfill.min.js"
    ></script>

    <!-- vue -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.min.js"></script>

    <!-- extractHtml已自動添加@babel/polyfill與vue -->

    <!-- fontawesome -->
    <link
        href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css"
        rel="stylesheet"
    />

    <!-- mdi, 各組件使用mdi/js會於轉單頁時改為mdi icon, 故需引用mdi/css -->
    <link
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
        rel="stylesheet"
    />

    <!-- google, 各組件使用mdi/js故不需引用 -->
    <link
        _href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900"
        rel="stylesheet"
    />
    <link
        _href="https://fonts.googleapis.com/css?family=Material+Icons"
        rel="stylesheet"
    />

    <!-- data -->
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataAAPL.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataUSD2EUR.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataTemperature.js"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataHousePriceArea.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataFlare.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRain.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/w-demores/res/data/dataRainClip.js"
    ></script>

    <!-- w-geo-vue -->
    <script src="https://cdn.jsdelivr.net/npm/w-geo-vue@1.0.49/dist/w-geo-vue.umd.js"></script>

    <style>
  .item {
    /* 因item位於demolink, 提取各範例html後會刪除demolink, 故得額外補上 */
    border-left: 3px solid #ffba75;
    margin: 5px 5px 8px 0px;
    padding: 3px 3px 5px 10px;
    font-size: 0.9rem;
    display: flex;
    justify-content: flex-start;
    align-items: center;
  }
  .head1 {
    padding: 0px 0px 20px 0px;
    font-size: 2.5rem;
  }
  .bkh {
    /* 寬 */
    padding: 20px;
  }
  @media screen and (max-width: 800px) {
    /* 中 */
    .bkh {
      padding: 10px;
    }
  }
  @media screen and (max-width: 400px) {
    /* 窄 */
    .bkh {
      padding: 5px;
    }
  }
  .bk {
    /* 寬 */
    display: inline-block;
    vertical-align: top;
    padding: 0px 80px 60px 0px;
  }
  @media screen and (max-width: 1000px) {
    /* 中窄 */
    .bk {
      display: block;
      padding: 0px 0px 50px 0px;
    }
  }
    </style>
</head>
<body
    style="font-family:'Microsoft JhengHei','Avenir','Helvetica'; padding:0px; margin:0px;"
>
    <div id="app" class="bkh" style>
        <div class="head1">
            <span
                style="cursor:pointer;"
                title="open for copy link to view component"
                onclick="window.open('//yuda-lyu.github.io/w-geo-vue/examples/app.html?cmp='+this.innerText,'_blank')"
            >w-soil-column-with-anchors</span>
        </div>
        <div class="bk">
            <div class="item">popup and color segments</div>

            <div style="width:420px;">
                <w-soil-column-with-anchors
                    :items="WSoilColumnWithAnchors.items1"
                    :markers="WSoilColumnWithAnchors.markers2"
                    :tick-down-positive="false"
                    :layer-with-popup="true"
                    :options-segments="WSoilColumnWithAnchors.optionsSegments2"
                    @click-marker="clickMarker2"
                >
                    <template v-slot:layer-popup="props">
                        <div
                            style="padding:6px 10px; font-size:0.85rem; white-space:nowrap;"
                        >
                            <div
                                style="font-weight:700;"
                            >{{props.item.description}}</div>
                            <div
                                style="color:#888;"
                            >{{props.item.depthStart}}m ~ {{props.item.depthEnd}}m</div>
                        </div>
                    </template>
                </w-soil-column-with-anchors>
            </div>

            <div
                style="padding-top:10px; font-size:0.85rem; color:#666;"
            >click-marker: {{WSoilColumnWithAnchors.msg2}}</div>
        </div>
    </div>

    <script>
  //install
  Vue.use(window["w-geo-vue"]);

  //initialize
  new Vue({
    el: "#app",

    data: function() {
      return {
        WSoilColumnWithAnchors: {
          items1,
          markers1,
          msg1: "",
          markers2: map(markers1, m => {
            return { ...m, state: "normal" };
          }),
          msg2: "",
          optionsSegments2: {
            segmentBackgroundType: "color",
            segmentBackgroundColor: "#FFB74D",
            segmentBorderColor: "#FB8C00",
            axisColor: "#666",
            tickColor: "#666"
          }
        }
      };
    },
    mounted: function() {
      return {};
    },
    computed: {},
    methods: {
      clickMarker1: function(msg) {
        let vo = this;
        vo.WSoilColumnWithAnchors.msg1 = get(msg, "item.key", "");
      },

      //點擊切換active狀態: 傳入新陣列即可更新各區塊樣式
      clickMarker2: function(msg) {
        let vo = this;
        let key = get(msg, "item.key", "");
        vo.WSoilColumnWithAnchors.msg2 = key;
        vo.WSoilColumnWithAnchors.markers2 = map(
          vo.WSoilColumnWithAnchors.markers2,
          m => {
            return { ...m, state: m.key === key ? "active" : "normal" };
          }
        );
      }
    }
  });
    </script>
</body>
</html>
